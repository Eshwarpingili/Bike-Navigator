set(CONFIG_FREERTOS 1)
set(CONFIG_BFLOG 0)
set(CONFIG_SHELL 0)

# BLE peripheral only (1 connection, no Classic)
set(CONFIG_BLUETOOTH 1)
set(CONFIG_BTBLECONTROLLER_LIB ble1m0s1bredr0)
set(CONFIG_RF 1)
set(CONFIG_BLE_USE_MAC2 0)

# Key-value store: the BLE stack keeps bonding data here, we keep the screen rotation
set(CONFIG_BFLB_MTD 1)
set(CONFIG_PARTITION 1)
set(CONFIG_EASYFLASH4 1)
# Keep pairing keys across reboots, so the phone does not have to re-pair
set(CONFIG_BT_SETTINGS 1)

# Display
set(CONFIG_PSRAM 1)
set(CONFIG_BSP_LCD 1)
set(CONFIG_BSP_TOUCH 1)
set(CONFIG_LVGL 1)
