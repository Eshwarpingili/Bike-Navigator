# Builds an unsigned BikeNav.ipa on a GitHub-hosted Mac. Install it on the iPhone from
# Windows with Sideloadly (it signs the app with your own Apple ID). See README.md.
name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-26 carries a current Xcode; nothing else pins the version now.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          set +e
          xcodebuild -project BikeNav.xcodeproj -scheme BikeNav -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|\*\* BUILD"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Actions logs are hidden from anyone who is not signed in, so repeat
            # the compiler's own errors as annotations, which are public.
            grep -E "error:" xcodebuild.log | sort -u | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      # Nothing is linked against @rpath any more - the Google SDKs were the
      # only dynamic frameworks - so there is nothing to embed by hand. What
      # can still go wrong silently is the icon: a missing or misnamed asset
      # catalog produces a blank icon and a build that otherwise looks fine.
      - name: Check the bundle
        run: |
          set -eu
          cd ios/build/Build/Products/Release-iphoneos/BikeNav.app
          if [ ! -f Assets.car ]; then
            echo "::error::Assets.car is missing - the asset catalog was not compiled in"
            exit 1
          fi
          if ! plutil -p Info.plist | grep -q CFBundleIcons; then
            echo "::error::no app icon in the bundle - check ASSETCATALOG_COMPILER_APPICON_NAME"
            exit 1
          fi
          # Actions logs need a signed-in account; annotations are public.
          echo "::notice::binary $(( $(stat -f%z BikeNav) / 1000000 )) MB | icon present | no embedded frameworks"

      - name: Package .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R BikeNav.app Payload/
          zip -qry "$GITHUB_WORKSPACE/BikeNav.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BikeNav-ipa
          path: BikeNav.ipa

      # Artifacts need a signed-in GitHub account, arrive as a zip, and expire.
      # A release asset is a plain link that downloads the .ipa directly on the
      # phone - which is where it has to end up every time.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          # Actions logs need a signed-in account, so anything worth reading has
          # to come out as an annotation. This step reported success while
          # leaving no release behind at all, and no amount of staring at the
          # YAML was going to explain that.
          echo "::notice::auth: $(gh auth status 2>&1 | tr '\n' ' ' | cut -c1-150)"
          echo "::notice::releases before: $(gh release list 2>&1 | head -3 | tr '\n' ' ' | cut -c1-150)"
          set -e

          # Never delete before creating. Deleting first leaves a window with no
          # release at all, and if the create then does not land - which is
          # exactly what happened once - the download link is simply gone, with
          # every step still reporting success. Create only when missing, then
          # replace the asset in place.
          NOTES="Built from ${{ github.sha }}. On the iPhone, tap BikeNav.ipa below, then add it in SideStore under My Apps."
          set +e
          if ! gh release view latest >/dev/null 2>&1; then
            create=$(gh release create latest --title "Latest build" --notes "$NOTES" --prerelease 2>&1)
            echo "::notice::create rc=$? out=$(echo "$create" | tr '\n' ' ' | cut -c1-150)"
          else
            edit=$(gh release edit latest --notes "$NOTES" --prerelease 2>&1)
            echo "::notice::edit rc=$? out=$(echo "$edit" | tr '\n' ' ' | cut -c1-150)"
          fi
          up=$(gh release upload latest BikeNav.ipa --clobber 2>&1)
          echo "::notice::upload rc=$? out=$(echo "$up" | tr '\n' ' ' | cut -c1-150)"
          set -e

          # Publish it, every time and explicitly. A draft release is visible to
          # the runner and to anyone signed in with access, and invisible to
          # everyone else - so gh reports success, the asset really is attached,
          # and the download link still 404s for the person holding the phone.
          # That is exactly what happened: the release sat as a draft for three
          # builds while every step went green.
          gh release edit latest --draft=false --prerelease

          # Prove it, the way the person downloading it would experience it. The
          # old check only asked whether the asset existed, which it did - on a
          # draft nobody could see. Draft state is the thing that has to be
          # checked, because that is the thing that was wrong.
          state=$(gh release view latest --json isDraft,assets \
            --jq '"draft=\(.isDraft) ipa=\([.assets[] | select(.name == "BikeNav.ipa") | .size] | length)"')
          echo "::notice::published state: $state"
          case "$state" in
            "draft=false ipa=1") ;;
            *) echo "::error::release is not publicly downloadable ($state)"; exit 1 ;;
          esac

          # And finally as a stranger sees it: no token, no account, just the URL
          # that goes on the phone. Everything above can pass while this 404s.
          code=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://github.com/${{ github.repository }}/releases/download/latest/BikeNav.ipa")
          echo "::notice::anonymous download: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::download link is not public (HTTP $code)"; exit 1; }
