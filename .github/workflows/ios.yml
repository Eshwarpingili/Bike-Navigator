# Builds an unsigned BikeNav.ipa on a GitHub-hosted Mac. Install it on the iPhone from
# Windows with Sideloadly (it signs the app with your own Apple ID). See README.md.
name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    # macos-26 for Xcode 26, which the Navigation SDK requires.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Resolve Swift packages
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies -project BikeNav.xcodeproj -scheme BikeNav

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project BikeNav.xcodeproj -scheme BikeNav -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|\*\* BUILD"

      # Xcode skips the "embed frameworks" phase when signing is off, because
      # anything it embeds would have to be signed. The app is therefore linked
      # against @rpath/GoogleMaps.framework with no such framework in the bundle
      # - it installs, then dies on launch. So embed them by hand: read what the
      # binary actually asks for and copy exactly those in.
      - name: Embed the SDK frameworks
        run: |
          set -eu
          APP="ios/build/Build/Products/Release-iphoneos/BikeNav.app"
          mkdir -p "$APP/Frameworks"
          otool -L "$APP/BikeNav" | awk '/@rpath\/.*\.framework\//{print $1}' \
            | sed 's|@rpath/||; s|/.*||' | sort -u > /tmp/needed.txt
          echo "binary asks for:"; cat /tmp/needed.txt
          while read -r fw; do
            [ -z "$fw" ] && continue
            if [ -d "$APP/Frameworks/$fw" ]; then continue; fi
            src=$(find ios/build -type d -name "$fw" -not -path "*/BikeNav.app/*" | head -1)
            if [ -z "$src" ]; then
              echo "::error::$fw is linked but was not found in the build output"
              exit 1
            fi
            echo "embedding $src"
            cp -R "$src" "$APP/Frameworks/"
          done < /tmp/needed.txt

      - name: Check the Google SDKs are really in the bundle
        run: |
          cd ios/build/Build/Products/Release-iphoneos/BikeNav.app
          echo "--- app bundle ---"
          du -sh .
          echo "--- embedded frameworks ---"
          ls -la Frameworks 2>/dev/null || echo "(no Frameworks directory)"
          echo "--- what the binary links against ---"
          otool -L BikeNav | sed -n '1,40p'
          # Every @rpath framework the binary names must now be present, or the
          # app crashes the moment it opens - with no console to say why.
          missing=0
          for fw in $(otool -L BikeNav | awk '/@rpath\/.*\.framework\//{print $1}' | sed 's|@rpath/||; s|/.*||' | sort -u); do
            if [ ! -d "Frameworks/$fw" ]; then
              echo "::error::$fw is linked but missing from the bundle"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # Surfaced as a notice because Actions logs are not visible to anyone
          # who is not signed in, while annotations are.
          size=$(stat -f%z BikeNav)
          fws=$(ls Frameworks 2>/dev/null | xargs echo)
          undef=$(nm -u BikeNav 2>/dev/null | grep -c "GMS" || true)
          echo "::notice::binary $((size/1000000)) MB | frameworks: ${fws:-none} | undefined GMS symbols: $undef"
          if [ "$undef" -gt 0 ] && [ -z "$fws" ]; then
            echo "::error::the binary needs GMS symbols at runtime but no framework provides them"
            exit 1
          fi

      - name: Package .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R BikeNav.app Payload/
          zip -qry "$GITHUB_WORKSPACE/BikeNav.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BikeNav-ipa
          path: BikeNav.ipa
