# XcodeGen spec: `xcodegen generate` turns this into BikeNav.xcodeproj (done in CI).
name: BikeNav
options:
  bundleIdPrefix: com.eshwar
  deploymentTarget:
    # SwiftUI Map(position:), MapPolyline and onChange(of:) two-parameter form.
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BikeNav:
    type: application
    platform: iOS
    sources: [BikeNav]
    scheme: {}
    info:
      path: BikeNav/Info.plist
      properties:
        CFBundleDisplayName: BikeNav
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: BikeNav follows your position along the route and updates the bike display.
        NSLocationAlwaysAndWhenInUseUsageDescription: BikeNav keeps guiding you while the phone is locked in your pocket.
        NSBluetoothAlwaysUsageDescription: BikeNav sends turn-by-turn directions to your BikeNav display over Bluetooth.
        UIBackgroundModes: [location, bluetooth-central]
    settings:
      base:
        # SideStore appends the Apple team id when it re-signs, so the
        # installed app is this plus that suffix.
        PRODUCT_BUNDLE_IDENTIFIER: com.eshwar.bikenav
        # The icon comes from Assets.xcassets, which is inside sources.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
