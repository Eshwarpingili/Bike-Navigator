# XcodeGen spec: `xcodegen generate` turns this into BikeNav.xcodeproj (done in CI).
name: BikeNav
options:
  bundleIdPrefix: com.eshwar
  deploymentTarget:
    # Navigation SDK needs at least iOS 16.
    iOS: "17.0"
packages:
  # Navigation SDK does the hard part: matching position to the route, advancing
  # through steps and rerouting. Swift Package Manager only - Google stopped
  # publishing these SDKs to CocoaPods at version 11.
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    exactVersion: "11.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BikeNav:
    type: application
    platform: iOS
    sources: [BikeNav]
    scheme: {}
    dependencies:
      - package: GoogleNavigation
        product: GoogleNavigation
    info:
      path: BikeNav/Info.plist
      properties:
        CFBundleDisplayName: BikeNav
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: BikeNav follows your position along the route and updates the bike display.
        NSLocationAlwaysAndWhenInUseUsageDescription: BikeNav keeps guiding you while the phone is locked in your pocket.
        NSBluetoothAlwaysUsageDescription: BikeNav sends turn-by-turn directions to your BikeNav display over Bluetooth.
        UIBackgroundModes: [location, bluetooth-central]
    settings:
      base:
        # Must match the iOS app restriction on the Google API key exactly.
        # Note the installed app is this plus the Apple team id, because
        # SideStore rewrites it when re-signing - both need to be on the key.
        PRODUCT_BUNDLE_IDENTIFIER: com.eshwar.bikenav
        # The icon comes from Assets.xcassets, which is inside sources.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
